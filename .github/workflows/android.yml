name: Android TWA APK

# 把线上站点（https://zhanbu.lufei.de）打成一个 Android APK：
#   - 用 Chrome 内核（Trusted Web Activity）跑，全屏无地址栏
#   - 站点更新 = App 更新，不需要重新发版
#   - 域名归属由 https://zhanbu.lufei.de/.well-known/assetlinks.json 校验
#
# 手动触发：Actions → Android TWA APK → Run workflow；产物在 Artifacts。

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 直接用 runner 预装的 Android SDK（setup-android@v3 会去装已下线的 `tools` 包而失败）
      - name: Install SDK packages
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK" -name sdkmanager -type f | sort | tail -1)"
          fi
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 secrets.ANDROID_KEYSTORE_BASE64（keystore 的 base64）" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Show APK info
        working-directory: android
        run: |
          ls -lh app/build/outputs/apk/release/
          $ANDROID_HOME/build-tools/34.0.0/aapt2 dump badging app/build/outputs/apk/release/app-release.apk | head -5 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yehe-liuyao-twa
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
