plugins {
  id 'com.android.application'
}

android {
  namespace 'de.lufei.zhanbu'
  compileSdk 34

  defaultConfig {
    applicationId 'de.lufei.zhanbu'
    minSdk 23
    targetSdk 34
    versionCode 1
    versionName '1.0.0'
    resValue 'string', 'asset_statements', '[{"relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "web", "site_url": "https://zhanbu.lufei.de"}}]'
  }

  signingConfigs {
    release {
      // CI 里由 secrets 注入：KEYSTORE_PATH / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      def storePath = System.getenv('KEYSTORE_PATH') ?: 'keystore.jks'
      storeFile file(storePath)
      storePassword System.getenv('KEYSTORE_PASSWORD')
      keyAlias System.getenv('KEY_ALIAS') ?: 'liuyao'
      keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
    }
  }

  buildTypes {
    release {
      signingConfig signingConfigs.release
      minifyEnabled false
      shrinkResources false
    }
    debug {
      applicationIdSuffix '.debug'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
